<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角接触球轴承计算器</title>
    <style>
        :root {
            --bg: #e8ecef;
            --panel: #f6f8f9;
            --ink: #14222e;
            --muted: #5d6b77;
            --line: #c5ced6;
            --accent: #0f5c8c;
            --accent-ink: #ffffff;
            --ok: #1f7a4d;
            --err: #b3261e;
            --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
            --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #10181f;
                --panel: #19232c;
                --ink: #e4ebf0;
                --muted: #93a2ae;
                --line: #2f3d49;
                --accent: #5fb0e0;
                --accent-ink: #0b1a24;
                --ok: #5bc88e;
                --err: #ff8a80;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 var(--sans);
        }

        header {
            padding: 28px 24px 8px;
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: .01em;
        }

        header p {
            margin: 4px 0 0;
            color: var(--muted);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px 48px;
            display: grid;
            grid-template-columns: minmax(300px, 400px) 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status.ready .dot {
            background: var(--ok);
        }

        .status.fail .dot {
            background: var(--err);
        }

        .field {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 4px 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        .field label {
            font-size: 14px;
        }

        .field label small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        input[type=number] {
            width: 100%;
            padding: 7px 9px;
            font: 14px var(--mono);
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            text-align: right;
        }

        input:focus-visible,
        button:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .hint {
            grid-column: 2;
            text-align: right;
            font-size: 12px;
            color: var(--muted);
            font-family: var(--mono);
            min-height: 1em;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        button {
            font: inherit;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }

        button:hover {
            border-color: var(--accent);
        }

        button.primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
            font-weight: 600;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .empty {
            color: var(--muted);
            padding: 24px 0;
        }

        .error {
            color: var(--err);
            border: 1px solid var(--err);
            border-radius: 6px;
            padding: 10px 12px;
            font-family: var(--mono);
            font-size: 13px;
            white-space: pre-wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            text-align: left;
            padding: 7px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        td.num {
            font-family: var(--mono);
            text-align: right;
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }

        .group {
            margin: 18px 0 6px;
            font-size: 14px;
            font-weight: 700;
        }

        .group:first-child {
            margin-top: 0;
        }

        .scroll {
            overflow-x: auto;
        }

        details {
            margin-top: 18px;
        }

        summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 13px;
        }

        figure.chart {
            margin: 0 0 8px;
        }

        figure.chart svg {
            display: block;
            width: 100%;
            max-width: 560px;
            height: auto;
            margin: 0 auto;
        }

        figure.chart figcaption {
            font-size: 12.5px;
            color: var(--muted);
            text-align: center;
            margin-top: 4px;
        }

        .c-ring { fill: var(--panel); stroke: var(--ink); stroke-width: 1.6; }
        .c-env { fill: none; stroke: var(--muted); stroke-width: 1.4; }
        .c-fill { fill: var(--accent); opacity: .12; stroke: none; }
        .c-arrow { stroke: var(--accent); stroke-width: 1.8; fill: none; }
        .c-line { stroke: var(--ink); stroke-width: 1.2; fill: none; }
        .c-dash { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 3; fill: none; }
        .c-txt { fill: var(--ink); font: 15px var(--sans); }
        .c-txt .it { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
        .c-sub { fill: var(--muted); font: 12px var(--mono); }
        .c-val { fill: var(--ink); font: 600 11.5px var(--mono); }
        .m-acc { fill: var(--accent); }
        .m-ink { fill: var(--ink); }

        pre {
            margin: 8px 0 0;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: auto;
            font: 12px/1.5 var(--mono);
            max-height: 360px;
        }
    </style>
</head>

<body>
    <header>
        <h1>角接触球轴承计算器</h1>
        <p>输入几何参数与载荷，调用 WebAssembly 模块 <code>calc</code> 并展示结果。</p>
    </header>

    <main>
        <section aria-labelledby="in-h">
            <h2 id="in-h">输入参数</h2>
            <div id="status" class="status"><span class="dot"></span><span id="status-text">正在加载 wasm…</span></div>
            <form id="form" autocomplete="off">
                <div id="fields"></div>
                <div class="actions">
                    <button type="submit" class="primary" id="run" disabled>计算</button>
                    <button type="button" id="reset">恢复默认</button>
                    <button type="button" id="export-json">导出 JSON</button>
                    <button type="button" id="import-json">导入 JSON</button>
                    <input type="file" id="json-file-input" accept=".json" style="display: none;">
                </div>
            </form>
        </section>

        <section aria-labelledby="out-h">
            <h2 id="out-h">计算结果</h2>
            <div id="result" aria-live="polite">
                <p class="empty">填写参数后点击“计算”。</p>
            </div>
        </section>
    </main>

    <script type="module">
        import init, { calc, LoadDistribution } from './pkg/wasm_wrapper.js';

        // 字段定义：名称,说明,默认值,步长
        const FIELDS = [
            { key: 'dw', label: 'dw', note: '滚动体直径', value: 22.23, step: 'any' },
            { key: 'dpw', label: 'dpw', note: '节圆直径', value: 125.3, step: 'any' },
            { key: 'z', label: 'z', note: '滚动体个数', value: 16, step: 1 },
            { key: 'alpha', label: 'alpha', note: '接触角（度°）', value: 40, step: 'any' },
            { key: 'fr', label: 'fr', note: '径向载荷', value: 17800.0, step: 'any' },
            { key: 'fa', label: 'fa', note: '轴向载荷', value: 17800.0, step: 'any' },
            { key: 'fi', label: 'fi', note: '内圈沟曲率系数', value: 11.6 / 22.23, step: 'any' },
            { key: 'fe', label: 'fe', note: '外圈沟曲率系数', value: 11.6 / 22.23, step: 'any' },
            { key: 'bm', label: 'bm', note: '动载荷材料系数, 球轴承取1.3', value: 1.3, step: '0.1' },
        ];

        // 基础参数中英文对照映射
        const LABELS = {
            'cr': '径向额定动载荷/N (Cr)',
            'c0r': '径向额定静载荷/N (C0r)',
            'ca': '轴向额定动载荷/N (Ca)',
            'c0a': '轴向额定静载荷/N (C0a)',
            'p0r': '径向当量静载荷/ (P0r)',
            'p0a': '轴向当量静载荷/ N (P0a)',
            's0': '静安全系数 (s0)',
            'l10': '额定寿命/百万转 (L10)',
        };

        const $ = (id) => document.getElementById(id);
        const form = $('form'), runBtn =$('run');

        // 生成输入框
        $('fields').innerHTML = FIELDS.map(f => `
    <div class="field">
      <label for="f-${f.key}">${f.label}<small>${f.note}</small></label>
      <input id="f-${f.key}" name="${f.key}" type="number" step="${f.step}" required>
      <div class="hint" id="h-${f.key}"></div>
    </div>`).join('');

        function fillDefaults() {
            FIELDS.forEach(f => { $('f-' + f.key).value = f.value; });
            updateHints();
        }

        function updateHints() {
            const deg = parseFloat($('f-alpha').value);$('h-alpha').textContent = isFinite(deg) ? `≈ ${(deg * Math.PI / 180).toFixed(4)} rad` : '';
        }

        function readFormRaw() {
            const o = {};
            FIELDS.forEach(f => { o[f.key] = parseFloat($('f-' + f.key).value); });
            return o;
        }

        function readInput() {
            const o = readFormRaw();
            o.alpha = (o.alpha * Math.PI) / 180;
            return o;
        }

        // ---------- 导入 & 导出 JSON 功能 ----------
        $('export-json').addEventListener('click', () => {
            const data = readFormRaw();
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'acb_input.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        $('import-json').addEventListener('click', () => {$('json-file-input').click();
        });

        $('json-file-input').addEventListener('change', (ev) => {
            const file = ev.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    FIELDS.forEach(f => {
                        if (data[f.key] !== undefined) {
                            $('f-' + f.key).value = data[f.key];
                        }
                    });
                    updateHints();
                } catch (err) {
                    showError('JSON 文件解析失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            ev.target.value = '';
        });

        // ---------- 结果渲染 ----------
        const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        function fmt(v) {
            if (typeof v === 'number') {
                if (!isFinite(v)) return String(v);
                if (Number.isInteger(v)) return String(v);
                const abs = Math.abs(v);
                return (abs !== 0 && (abs < 1e-3 || abs >= 1e7)) ? v.toExponential(5) : String(+v.toPrecision(7));
            }
            if (typeof v === 'bigint') return v.toString();
            if (v === null || v === undefined) return '—';
            return esc(v);
        }

        function normalize(v) {
            if (v instanceof Map) return normalize(Object.fromEntries(v));
            if (Array.isArray(v)) return v.map(normalize);
            if (v && typeof v === 'object') {
                return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, normalize(x)]));
            }
            return v;
        }

        const isPrimitive = (v) => v === null || typeof v !== 'object';

        let currentChart = '';

        function renderLoadResult(lr) {
            if (!lr || typeof lr !== 'object') return '';
            const psi = lr.psi || [];
            const load = lr.load || [];
            const sigma_i = lr.sigma_i || [];
            const sigma_o = lr.sigma_o || [];
            const len = Math.max(psi.length, load.length, sigma_i.length, sigma_o.length);

            let rows = '';
            for (let i = 0; i < len; i++) {
                const angleDeg = psi[i] !== undefined ? (psi[i] * 180 / Math.PI).toFixed(2) + '°' : '—';
                rows += `<tr>
                    <td class="num">${i + 1}</td>
                    <td class="num">${angleDeg}</td>
                    <td class="num">${fmt(load[i])}</td>
                    <td class="num">${fmt(sigma_i[i])}</td>
                    <td class="num">${fmt(sigma_o[i])}</td>
                </tr>`;
            }

            return currentChart + `<div class="group">载荷分布 (load_result)</div>
            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align:right">位置角 (deg)</th>
                            <th style="text-align:right">载荷 (load)</th>
                            <th style="text-align:right">内圈应力 (sigma_i)</th>
                            <th style="text-align:right">外圈应力 (sigma_o)</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        function renderValue(title, v) {
            if (v && typeof v === 'object') {
                const prims = Object.entries(v).filter(([k, x]) => isPrimitive(x) && k !== 'load_result');
                let html = title ? `<div class="group">${esc(title)}</div>` : '';
                if (prims.length) {
                    html += `<div class="scroll"><table><tbody>${prims.map(([k, x]) => {
                        const displayName = LABELS[k] || esc(k);
                        return `<tr><th>${displayName}</th><td class="num">${fmt(x)}</td></tr>`;
                    }).join('')}</tbody></table></div>`;
                }

                if (v.load_result) {
                    html += renderLoadResult(v.load_result);
                }

                Object.entries(v).forEach(([k, x]) => {
                    if (!isPrimitive(x) && k !== 'load_result') {
                        html += renderValue(k, x);
                    }
                });
                return html;
            }
            return `<div class="scroll"><table><tbody><tr><th>result</th><td class="num">${fmt(v)}</td></tr></tbody></table></div>`;
        }


        // ---------- 载荷分布图 ----------
        const TAU = Math.PI * 2;
        const wrapPi = (a) => (((a + Math.PI) % TAU) + TAU) % TAU - Math.PI;

        // LoadDistribution 的构造函数与 calc 接收同一份 ACBInput
        function makeDist(input) {
            return new LoadDistribution(input);
        }

        // 由 load(ψ) 数值求承载区半角 ψ_l（load>0 的最大 ψ），不依赖后端暴露 ε
        function findPsiL(f) {
            const N = 720;
            let prev = 0;
            for (let i = 1; i <= N; i++) {
                const cur = (Math.PI * i) / N;
                if (!(f(cur) > 0)) {
                    let lo = prev, hi = cur;
                    for (let j = 0; j < 40; j++) {
                        const mid = (lo + hi) / 2;
                        if (f(mid) > 0) lo = mid; else hi = mid;
                    }
                    return (lo + hi) / 2;
                }
                prev = cur;
            }
            return Math.PI;
        }

        function buildLoadChart(input, data) {
            const lr = data && data.load_result;
            if (!lr || !Array.isArray(lr.psi) || !Array.isArray(lr.load)) return '';

            // 连续分布函数（来自 wasm）；失败则退化为仅绘制离散载荷
            let dist = null, note = '';
            try { dist = makeDist(input); }
            catch (e) { note = '（LoadDistribution 构造失败，已仅绘制各滚动体载荷：' + esc(e && e.message ? e.message : e) + '）'; }

            try {
                const f = dist ? (p) => dist.load(p) : null;

                // 各滚动体载荷：ψ 以径向载荷方向为 0，归一化到 (-π, π]
                const pts = lr.psi
                    .map((p, i) => ({ psi: wrapPi(p), q: lr.load[i] }))
                    .filter(d => isFinite(d.q) && d.q > 0)
                    .sort((a, b) => a.psi - b.psi);
                const qDisc = Math.max(0, ...pts.map(d => d.q));
                const qmax = f ? Math.max(f(0), qDisc) : qDisc;
                if (!(qmax > 0)) return '';

                // 承载区半角 ψ_l（cosψ_l = 1 - 2ε）：优先由 load(ψ) 反推，失败时用离散点近似
                const psiL = f ? findPsiL(f) : Math.max(0, ...pts.map(d => Math.abs(d.psi)));
                if (!(psiL > 0)) return '';

                // 几何：ψ=0 朝下（与 Fr 方向一致），内圈半径 R，载荷箭头最大长度 L
                const W = 520, H = 470, cx = 260, cy = 225, R = 95, L = 90;
                const k = L / qmax;
                const P = (psi, r) => [cx + r * Math.sin(psi), cy + r * Math.cos(psi)];
                const pt = ([x, y]) => x.toFixed(2) + ',' + y.toFixed(2);

                // 包络线 q(ψ)
                let env = [];
                if (f) {
                    const N = 160;
                    for (let i = 0; i <= N; i++) {
                        const p = -psiL + (2 * psiL * i) / N;
                        env.push(P(p, R + k * Math.max(0, f(p))));
                    }
                } else {
                    env = [P(pts[0].psi, R), ...pts.map(d => P(d.psi, R + k * d.q)), P(pts[pts.length - 1].psi, R)];
                }
                const envPath = 'M' + env.map(pt).join(' L');
                const fillPath = envPath + ' L' + [...Array(41)].map((_, i) => pt(P(psiL - (2 * psiL * i) / 40, R))).join(' L') + ' Z';

                // 各滚动体载荷箭头（指向内圈）
                const arrows = pts.map(d => {
                    const a = P(d.psi, R + k * d.q), b = P(d.psi, R);
                    // 载荷数值标注：放在箭尾外侧
                    const sx = Math.sin(d.psi), cs = Math.cos(d.psi);
                    const t = P(d.psi, R + k * d.q + 8);
                    const anchor = sx > 0.3 ? 'start' : sx < -0.3 ? 'end' : 'middle';
                    const dy = cs > 0.3 ? 11 : cs < -0.3 ? -2 : 4;
                    const val = Math.abs(d.q) >= 100 ? d.q.toFixed(0) : String(+d.q.toPrecision(3));
                    // 方位角（0°~360°，与表格“位置角”一致）
                    const deg = (((d.psi * 180 / Math.PI) % 360) + 360) % 360;
                    const ang = (Math.abs(deg - Math.round(deg)) < 0.05 ? String(Math.round(deg)) : deg.toFixed(1)) + '°';
                    const ady = cs > 0.3 ? 12 : cs < -0.3 ? -12 : 16;
                    return `<line class="c-arrow" x1="${a[0].toFixed(2)}" y1="${a[1].toFixed(2)}" x2="${b[0].toFixed(2)}" y2="${b[1].toFixed(2)}" marker-end="url(#ah-acc)"/>` +
                        `<text class="c-val" x="${t[0].toFixed(2)}" y="${(t[1] + dy).toFixed(2)}" text-anchor="${anchor}">${val}</text>` +
                        `<text class="c-sub" x="${t[0].toFixed(2)}" y="${(t[1] + dy + ady).toFixed(2)}" text-anchor="${anchor}">${ang}</text>`;
                }).join('');

                const yb = cy + R;
                const pl = P(-psiL, R), pr = P(psiL, R);

                return `<div class="group">载荷分布图</div>
<figure class="chart">
<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="滚动轴承载荷分布图">
  <defs>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-acc" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <path class="c-fill" d="${fillPath}"/>
  <path class="c-env" d="${envPath}"/>
  ${arrows}
  <circle class="c-ring" cx="${cx}" cy="${cy}" r="${R}" fill-opacity=".0"/>
  <line class="c-dash" x1="${cx - 55}" y1="${cy}" x2="${cx + 55}" y2="${cy}"/>
  <line class="c-dash" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R - 25}"/>
  <line class="c-line" x1="${cx}" y1="${cy}" x2="${pl[0].toFixed(2)}" y2="${pl[1].toFixed(2)}"/>
  <line class="c-line" x1="${cx}" y1="${cy}" x2="${pr[0].toFixed(2)}" y2="${pr[1].toFixed(2)}"/>
  <line class="c-line" x1="${cx}" y1="${cy}" x2="${cx}" y2="${yb.toFixed(2)}" marker-end="url(#ah-ink)"/>
</svg>
<figcaption>箭头旁：上为载荷（单位同 fr），下为方位角（以径向载荷方向为 0°）；曲线：连续分布 q(ψ) ${note}</figcaption>
</figure>`;
            } finally {
                if (dist && dist.free) dist.free();
            }
        }

        function showResult(res, input) {
            const data = normalize(res);
            const json = JSON.stringify(data, (_, x) => typeof x === 'bigint' ? x.toString() : x, 2);
            currentChart = '';
            try { currentChart = buildLoadChart(input, data); } catch (e) { console.error(e); }
            $('result').innerHTML = renderValue('', data) +
                `<details><summary>查看原始 JSON</summary><pre>${esc(json)}</pre></details>`;
        }

        function showError(e) {
            $('result').innerHTML = `<div class="error">${esc(e && e.message ? e.message : e)}</div>`;
        }

        form.addEventListener('submit', (ev) => {
            ev.preventDefault();
            try {
                const t0 = performance.now();
                const input = readInput();
                const res = calc(input);
                console.log('calc 用时', (performance.now() - t0).toFixed(2), 'ms', res);
                showResult(res, input);
            } catch (e) {
                console.error(e);
                showError(e);
            }
        });
        $('f-alpha').addEventListener('input', updateHints);$('reset').addEventListener('click', fillDefaults);

        fillDefaults();

        const status = $('status');
        try {
            await init();
            status.className = 'status ready';
            $('status-text').textContent = 'wasm 已就绪';
            runBtn.disabled = false;
            window.calc = calc;
        } catch (e) {
            console.error(e);
            status.className = 'status fail';
            $('status-text').textContent = 'wasm 加载失败';
            showError('无法加载 ./pkg/acb.js 或 acb_bg.wasm。\n请确认：1) 用 --target web 构建；2) 通过 http 服务器访问，而不是 file://。\n\n' + (e && e.message ? e.message : e));
        }
    </script>
